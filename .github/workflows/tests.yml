name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # uv 按 .python-version 自动下载并锁定 Python；vendor wheel 已在仓库内
      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run tests
        run: uv run pytest -q
